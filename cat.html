<!DOCTYPE html>
<html>
<head>
    <title>Cat Cursor</title>
    <style>
        body { margin: 0; background: #fafbfc; overflow: hidden; cursor: none; font-family: sans-serif;}
        canvas { display: block; }
        .info { position: absolute; top: 10px; left: 10px; color: #333; background: rgba(255,255,255,0.7); padding: 5px; border-radius: 4px;}
    </style>
</head>
<body>
    <div class="info">Move mouse to play with the cat!</div>
    <canvas id="catCanvas"></canvas>
    <script>
        const canvas = document.getElementById('catCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2, moved: false };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.moved = true;
        });

            y: mouse.y,
            speed: 0.1, 
            color: '#444', 
            eyeColor: '#90EE90' 
        };

            ctx.translate(x, y);

            ctx.strokeStyle = cat.color;
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
