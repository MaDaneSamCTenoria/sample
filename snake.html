<!DOCTYPE html>
<html>
<head>
    <title>Snake Cursor</title>
    <style>
        body { margin: 0; background: #0d1117; overflow: hidden; cursor: none; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="snakeCanvas"></canvas>
    <script>
        const canvas = document.getElementById('snakeCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        
        // Snake segments
        const segments = [];
        const numSegments = 15;
        const radius = 8;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        for (let i = 0; i < numSegments; i++) {
            segments.push({ x: mouse.x, y: mouse.y });
        }

        function draw() {
            ctx.fillStyle = '#0d1117';
            ctx.fillRect(0, 0, width, height);

            segments[0].x = mouse.x;
            segments[0].y = mouse.y;

            // Update body to follow head
            for (let i = 1; i < numSegments; i++) {
                // Smooth easing effect
                segments[i].x += (segments[i-1].x - segments[i].x) * 0.35;
                segments[i].y += (segments[i-1].y - segments[i].y) * 0.35;

                ctx.beginPath();
                ctx.arc(segments[i].x, segments[i].y, radius - (i * 0.4), 0, Math.PI * 2);
                ctx.fillStyle = i === 0 ? '#39d353' : '#26a641'; // Classic GitHub Green
                ctx.fill();
                ctx.closePath();
            }

            requestAnimationFrame(draw);
        }

        resize();
        draw();
    </script>
</body>
</html>
